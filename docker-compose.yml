services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: postgres_lab2
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: lab2_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: adminer_lab2
    restart: unless-stopped
    ports:
      - "8082:8080"

  redis:
    image: redis:7-alpine
    container_name: redis_lab3
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  minio_data:
  pg_data:
