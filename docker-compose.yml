services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-https://artem5438.github.io,http://localhost,http://localhost:5173,http://127.0.0.1:5173,http://tauri.localhost,tauri://localhost,https://localhost,https://127.0.0.1}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command: /scripts/minio-init.sh
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_BUCKET: publishing-media
    volumes:
      - ./scripts/minio-init.sh:/scripts/minio-init.sh:ro

  postgres:
    image: postgres:16-alpine
    container_name: postgres_lab2
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: lab2_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: adminer_lab2
    restart: unless-stopped
    ports:
      - "8082:8080"

  redis:
    image: redis:7-alpine
    container_name: redis_lab3
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: publishing_backend_lab2
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: admin
      DB_PASSWORD: secret
      DB_NAME: lab2_db
      REDIS_ADDR: redis:6379
      JWT_SECRET: dev-jwt-secret-change-me
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,tauri://localhost,http://tauri.localhost}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: publishing-media
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/publishing-media}
      MINIO_USE_SSL: "false"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../publishing-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
        VITE_MEDIA_BASE_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/publishing-media}
    container_name: publishing_frontend_lab2
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - minio

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_lab2
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_lab2
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  minio_data:
  pg_data:
